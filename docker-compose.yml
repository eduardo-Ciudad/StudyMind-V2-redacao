# Backend + PostgreSQL. As variáveis vêm do arquivo .env (copie de .env.example).
# Subir:   docker compose up -d --build
# Logs:    docker compose logs -f api
# Parar:   docker compose down          (os dados ficam no volume pgdata)
name: studymind-redacao

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-studymind_redacao}
      POSTGRES_USER: ${DB_USERNAME:-studymind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Só para acessar pelo DBeaver/psql na sua máquina; 5433 para não brigar com o Postgres local na 5432.
    # Fica preso ao 127.0.0.1: o banco não é exposto para a rede.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-studymind_redacao}
      DB_USERNAME: ${DB_USERNAME:-studymind}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (mínimo 32 caracteres)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?defina GEMINI_API_KEY no .env}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:5173}
      CADASTRO_ABERTO: ${CADASTRO_ABERTO:-false}
      CADASTRO_EMAILS_PERMITIDOS: ${CADASTRO_EMAILS_PERMITIDOS:-}
      LIMITE_CORRECOES_DIARIAS: ${LIMITE_CORRECOES_DIARIAS:-3}
      LIMITE_CORRECOES_GLOBAL: ${LIMITE_CORRECOES_GLOBAL:-30}
      JWT_EXPIRACAO_MINUTOS: ${JWT_EXPIRACAO_MINUTOS:-120}
      FORWARD_HEADERS: ${FORWARD_HEADERS:-none}
    ports:
      - "8080:8080"
    # Uma correção pode levar até ~140 s: dá tempo de terminar antes do container ser morto no stop/deploy
    stop_grace_period: 150s
    restart: unless-stopped

volumes:
  pgdata:
